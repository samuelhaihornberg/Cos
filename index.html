<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>hellow world — co & cos</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #0d1017;
			color: #f9fafb;
			font-family: monospace;
			overflow: hidden;
			transition: background 0.3s ease;
		}
		.cos-box {
			position: relative;
			z-index: 2;
			width: min(92vw, 720px);
			padding: 28px 22px;
			border-radius: 12px;
			background: #111827;
			border: 1px solid #1f2937;
			text-align: center;
			transition: border-color 0.25s ease, box-shadow 0.25s ease;
		}
		.cos-box.actif {
			border-color: #64748b;
			box-shadow: 0 0 24px rgba(148, 163, 184, 0.2);
		}
		.cos-title {
			color: #9ca3af;
			letter-spacing: 2px;
			font-size: clamp(26px, 5vw, 46px);
			transition: color 0.2s ease, transform 0.2s ease;
		}
		.cos-title.actif {
			color: #ffffff;
			transform: scale(1.04);
		}
		.cos-sub {
			margin-top: 10px;
			color: #64748b;
			font-size: 13px;
		}
		.cos-sub.actif {
			color: #38bdf8;
		}
		.cos-btn {
			margin-top: 20px;
			padding: 10px 18px;
			border-radius: 8px;
			border: 1px solid #374151;
			background: #1f2937;
			color: #f9fafb;
			font-family: inherit;
			cursor: pointer;
		}
		#fxCanvas {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 1;
		}
	</style>
</head>
<body data-cos="BODY1">
	<!-- Bibliothèque : règle de la règle uniquement (co = connexion, cos = connexions) -->

	<canvas id="fxCanvas" data-cos="FX1"></canvas>

	<div id="app" class="cos-box" data-cos="BOX1">
		<h1 id="titre" class="cos-title" data-cos="H1">hellow world</h1>
		<p id="sousTitre" class="cos-sub" data-cos="P1">structure connectée</p>
		<button id="actionBtn" class="cos-btn" data-cos="BTN1">Déclencher</button>
	</div>

	<script type="text/cos">
		<cos>
			<co>BTN1 ↔️ BOX1</co>
			<co>BTN1 ↔️ H1</co>
			<co>BTN1 ↔️ P1</co>
			<co>BTN1 ↔️ FX1</co>
			<co>BTN1 ↔️ AUDIO1</co>
			<co>H1 ↔️ P1</co>
			<co>BOX1 ↔️ BODY1</co>
		</cos>
	</script>

	<script>
		const map = {};
		document.querySelectorAll("[data-cos]").forEach(el => map[el.dataset.cos] = el);

		const canvas = map.FX1;
		const ctx = canvas.getContext("2d");
		const pts = [];
		let audioCtx = null;

		const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
		window.addEventListener("resize", resize);
		resize();

		function lancerFeuxEtEtincelles(x, y) {
			const cols = ["#facc15", "#38bdf8", "#f472b6", "#4ade80", "#c084fc"];
			for (let i = 0; i < 42; i++) {
				const a = (Math.PI * 2 * i) / 42;
				const v = 1.8 + Math.random() * 4.8;
				pts.push({
					x, y,
					vx: Math.cos(a) * v,
					vy: Math.sin(a) * v,
					life: 1,
					c: cols[i % cols.length],
					etincelle: i % 2 === 0
				});
			}
		}

		function jouerAudioRetro() {
			audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
			const t = audioCtx.currentTime;
			const osc = audioCtx.createOscillator();
			const gain = audioCtx.createGain();
			osc.type = "square";
			osc.frequency.setValueAtTime(340, t);
			osc.frequency.exponentialRampToValueAtTime(920, t + 0.16);
			gain.gain.setValueAtTime(0.07, t);
			gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
			osc.connect(gain);
			gain.connect(audioCtx.destination);
			osc.start(t);
			osc.stop(t + 0.18);
		}

		(function loop() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			for (let i = pts.length - 1; i >= 0; i--) {
				const p = pts[i];
				p.x += p.vx;
				p.y += p.vy;
				p.vy += 0.06;
				p.life -= 0.022;
				if (p.life <= 0) { pts.splice(i, 1); continue; }
				ctx.globalAlpha = Math.max(0, p.life);
				ctx.fillStyle = p.c;
				ctx.fillRect(p.x, p.y, p.etincelle ? 4 : 2.5, p.etincelle ? 4 : 2.5);
			}
			ctx.globalAlpha = 1;
			requestAnimationFrame(loop);
		})();

		const liens = {};
		document.querySelectorAll('script[type="text/cos"]').forEach(bloc => {
			bloc.textContent.replace(/<co>(.*?)<\/co>/g, (_, pair) => {
				const [a, b] = pair.split("↔️").map(s => s.trim());
				if (map[a]) (liens[a] ||= []).push(b);
			});
		});

		Object.entries(liens).forEach(([src, cibles]) => {
			map[src].addEventListener("click", (e) => {
				const rect = map[src].getBoundingClientRect();
				const x = e.clientX || rect.left + rect.width / 2;
				const y = e.clientY || rect.top + rect.height / 2;

				cibles.forEach(c => {
					if (c === "FX1") lancerFeuxEtEtincelles(x, y);
					else if (c === "AUDIO1") jouerAudioRetro();
					else if (map[c]) map[c].classList.toggle("actif");
				});

				if (map.P1) {
					map.P1.textContent = map.H1.classList.contains("actif") ? "hellow world actif" : "structure connectée";
				}
			});
		});
	</script>
</body>
</html>
